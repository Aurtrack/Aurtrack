# Lefthook: fast local checks only. CI is the source of truth.

pre-commit:
  parallel: true
  commands:
    rustfmt:
      glob: "*.rs"
      run: cargo fmt --all -- --check

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

# pre-push 暂时不启用：
# - 还没有 crate，Rust 检查没有对象；
# - lefthook 在 Windows 上对多行 shell 脚本解析不稳定。
# 第一个 crate 出现后，改成单行调用 scripts/pre-push.sh，避免多行解析。
