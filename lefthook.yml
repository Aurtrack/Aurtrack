# Lefthook: fast local checks only. CI is the source of truth.

pre-commit:
  parallel: true
  commands:
    rustfmt:
      glob: "*.rs"
      run: cargo fmt --all -- --check

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-push:
  commands:
    rust:
      run: |
        # 仓库刚初始化、还没有任何 crate 时，cargo 会因为虚拟 manifest 直接失败。
        if ! ls crates/*/Cargo.toml >/dev/null 2>&1; then
          echo "还没有 crate，跳过 Rust 检查"
          exit 0
        fi
        cargo clippy --workspace --all-targets -- -D warnings
        if cargo nextest --version >/dev/null 2>&1; then
          cargo nextest run --workspace
        else
          echo "未安装 cargo-nextest，改用 cargo test"
          cargo test --workspace
        fi
